name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      # cpp-engine.ref pins the Team-Haruki/sekai-deck-recommend-cpp commit for CI, releases
      # and the Dockerfile (which COPYs and reads it); the script clones it with submodules
      # into _cpp_src.
      setup-command: ./scripts/prepare-cpp-engine.sh

  # Custom job: the C++ bridge coverage (gcov + gcovr, Sonar generic format) has no template;
  # it moved here from the old sonar.yml so sonar.yml only scans.
  cpp:
    name: C++ bridge tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache-key: cpp-coverage
      - name: Prepare C++ engine
        run: ./scripts/prepare-cpp-engine.sh
      - name: Bridge + engine tests with gcovr
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr-venv"
          "$RUNNER_TEMP/gcovr-venv/bin/pip" install gcovr==8.4
          PATH="$RUNNER_TEMP/gcovr-venv/bin:$PATH" ./scripts/ci-cpp-coverage.sh coverage/cpp.xml # moved out of the old sonar.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cpp
          path: coverage/
          retention-days: 3

  sonar:
    name: Sonar
    needs: [rust, cpp]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      defer-moving-tags: true # push :sha-* right away; :main moves after CI OK (docker-tags)
      cache-backend: registry
      cache-mode: max

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [rust, cpp, sonar, docker, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  docker-tags:
    name: Docker tags # :main follows only commits whose CI OK passed
    needs: [docker, ci-ok]
    # Explicit result check: the implicit success() also fails when any job upstream of ci-ok was
    # skipped (e.g. a PR-only job), which silently skipped this job on main.
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && needs.docker.outputs.deferred-tags != '' }}
    permissions:
      contents: read
      packages: write
    uses: seiunx-dev/ci-templates/.github/workflows/docker-retag.yml@v1
    with:
      image: ${{ needs.docker.outputs.image }}
      digest: ${{ needs.docker.outputs.digest }}
      tags: ${{ needs.docker.outputs.deferred-tags }}
