name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DECK_CPP_REPO: https://github.com/Team-Haruki/sekai-deck-recommend-cpp.git
  DECK_CPP_BRANCH: master
  DECK_CPP_REF: b2387b7f09e5a420c9bfee9ece8903b345dd39cd

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare C++ engine source
        run: |
          git clone --branch "$DECK_CPP_BRANCH" --single-branch "$DECK_CPP_REPO" _cpp_src
          git -C _cpp_src checkout "$DECK_CPP_REF"
          git -C _cpp_src submodule update --init --recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked
