name: Build Docker Image

on:
  push:
    tags:
      - "v*"

env:
  DECK_CPP_REPO: "https://github.com/Deseer/sekai-deck-recommend-cpp.git"
  DECK_CPP_REF: "master"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clone C++ engine source
        run: |
          git clone --depth 1 --branch "${DECK_CPP_REF}" "${DECK_CPP_REPO}" _cpp_src
          cd _cpp_src && git submodule update --init --recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: docker-amd64

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: "v4-docker"

      - name: Get version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)"
          fi
          CRATE_VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "crate_version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp Cargo version from tag
        env:
          CRATE_VERSION: ${{ steps.version.outputs.crate_version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          version = os.environ["CRATE_VERSION"]
          updated, count = re.subn(
              r'(?m)^version = ".*"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update Cargo.toml version")
          path.write_text(updated)
          PY

      - name: Build static binary
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl

      - name: Prepare runtime image context
        run: |
          rm -rf out/docker-image
          mkdir -p out/docker-image
          cp target/x86_64-unknown-linux-musl/release/deck-service out/docker-image/deck-service
          cp -R _cpp_src/data out/docker-image/data
          cp Dockerfile.runtime out/docker-image/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          VERSION=${{ steps.version.outputs.tag }}
          docker build \
            -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest out/docker-image

      - name: Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          VERSION=${{ steps.version.outputs.tag }}
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
