name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1

  binaries:
    name: Binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/rust-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      setup-command: ./scripts/prepare-cpp-engine.sh
      # Same two assets as before. linux-x64 stays a glibc build: SekaiColo's Dockerfile
      # downloads deck-service-linux-x64.tar.gz. (A musl/zigbuild target would need zig 0.15.2,
      # which rust-release pins by default.)
      targets: >-
        [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
         {"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"}]
      asset-name: "{name}-{label}"
      layout: flat

  docker:
    name: Docker
    needs: gate
    if: needs.gate.outputs.is-tag == 'true' # dry runs never push images
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      promote-on-tag: true
      cache-backend: registry

  publish:
    name: GitHub Release
    needs: [gate, binaries, docker]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}
