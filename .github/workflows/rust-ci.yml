name: Rust CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/rust-ci.yml"
      - "src/**"
      - "cpp_bridge/**"
      - "build.rs"
      - "build.zig"
      - "cpp_sources.txt"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/rust-ci.yml"
      - "src/**"
      - "cpp_bridge/**"
      - "build.rs"
      - "build.zig"
      - "cpp_sources.txt"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  DECK_CPP_REPO: "https://github.com/Deseer/sekai-deck-recommend-cpp.git"
  DECK_CPP_REF: "7d740ab331846d051f12bf8e32f651c8ac8506a7"

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Clone C++ engine source
        run: |
          git clone --branch master --single-branch "${DECK_CPP_REPO}" _cpp_src
          cd _cpp_src
          git checkout "${DECK_CPP_REF}"
          git submodule update --init --recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: rust-ci-build

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: "v3"

      - name: Build
        run: cargo build

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  cross-compile:
    name: Cross-compile (Linux x86_64 musl)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Clone C++ engine source
        run: |
          git clone --branch master --single-branch "${DECK_CPP_REPO}" _cpp_src
          cd _cpp_src
          git checkout "${DECK_CPP_REF}"
          git submodule update --init --recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: rust-ci-cross

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: "v3"

      - name: Build static binary
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/deck-service
          file target/x86_64-unknown-linux-musl/release/deck-service | grep -q "statically linked"
