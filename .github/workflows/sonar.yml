name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DECK_CPP_REPO: https://github.com/Team-Haruki/sekai-deck-recommend-cpp.git
  DECK_CPP_BRANCH: master
  DECK_CPP_REF: b2387b7f09e5a420c9bfee9ece8903b345dd39cd

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare C++ engine source
        run: |
          git clone --branch "$DECK_CPP_BRANCH" --single-branch "$DECK_CPP_REPO" _cpp_src
          git -C _cpp_src checkout "$DECK_CPP_REF"
          git -C _cpp_src submodule update --init --recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: sonar-coverage

      - name: Install gcovr
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr-venv"
          "$RUNNER_TEMP/gcovr-venv/bin/pip" install gcovr==8.4

      - name: Run C++ bridge coverage tests
        env:
          DECK_CPP_COVERAGE: "1"
          CARGO_TARGET_DIR: target/coverage
        run: |
          mkdir -p target/coverage
          find target/coverage -name '*.gcda' -delete
          cargo test --locked --test cpp_bridge
          bridge_library="$(find target/coverage/debug/build -path '*/out/native-cpp/lib/libdeck_recommend.a' -print -quit)"
          test_dir="target/coverage/cpp-tests"
          mkdir -p "$test_dir"
          c++ \
            -std=c++20 \
            -O0 \
            -g \
            --coverage \
            -fno-sanitize=all \
            -I _cpp_src/src \
            -I _cpp_src/3rdparty/yyjson/src \
            -I cpp_bridge \
            -c tests/deck_recommend_c_test.cpp \
            -o "$test_dir/deck_recommend_c_test.o"
          c++ \
            --coverage \
            "$test_dir/deck_recommend_c_test.o" \
            "$bridge_library" \
            -pthread \
            -o "$test_dir/deck_recommend_c_test"
          "$test_dir/deck_recommend_c_test"

      - name: Generate SonarQube coverage report
        run: |
          mkdir -p coverage
          "$RUNNER_TEMP/gcovr-venv/bin/gcovr" \
            --root "$GITHUB_WORKSPACE" \
            --filter "$GITHUB_WORKSPACE/cpp_bridge/" \
            --sonarqube-metric line \
            --sonarqube coverage/sonar-coverage.xml \
            --print-summary \
            target/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
