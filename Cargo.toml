[package]
name = "deck-service"
version = "0.6.2"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ruzstd = "0.9"
parking_lot = "0.12"
# Registry client: plain http on the tailnet, so no TLS backend (the runtime
# image is FROM scratch and carries no CA bundle).
reqwest = { version = "0.12", default-features = false }
sha2 = "0.11"

[profile.release]
lto = "thin"
